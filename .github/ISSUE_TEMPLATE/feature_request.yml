name: 功能建议
description: 建议一个新功能或改进
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 先说清场景与不便之处，再说方案——优先解决真实场景里的问题。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的效果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你现在是怎么绕过这个问题的？
