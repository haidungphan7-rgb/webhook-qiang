# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
# docs: https://golangci-lint.run/usage/configuration/
version: "2"

run:
  modules-download-mode: readonly
  allow-parallel-runners: true

output:
  formats: {text: {path: stdout}}

linters:
  default: none
  # Deliberately off, with reasons:
  # - mnd / nestif / nlreturn: literal HTTP codes, buffer sizes and CIDR octets are
  #   intentional and documented in place; nesting is gated by review, not a counter.
  # - contextcheck: the doctor/status probes intentionally use short-lived contexts
  #   that must not be cancelled when the request they diagnose goes away.
  # - forbidigo: the CLI is a terminal app - fmt.Print* in cli/doctor is the product,
  #   not a forgotten debug statement.
  # - funlen / gocyclo / gocognit: flag wiring (urfave/cli) and SQL row scanning are
  #   linear by nature; splitting them hurts readability more than it helps.
  # - gochecknoglobals: the package-level vars are immutable lookup tables and wired
  #   singletons, which is idiomatic Go.
  # - goconst: "items"/"env" repeated three times across unrelated handlers is not
  #   a constant-worthy abstraction.
  # - lll: hard-wrapping SQL strings and table-driven tests makes them worse to read.
  # - misspell: British spelling (honour, serialise) is used consistently on purpose.
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - godot
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - nakedret
    - nolintlint
    - prealloc
    - promlinter
    - staticcheck
    - unconvert
    - unused
    - whitespace
    - wsl_v5
  settings:
    dupl:
      threshold: 100
    godot:
      scope: declarations
      capital: false
    govet:
      enable:
        - shadow
    nakedret:
      max-func-lines: 100
    nolintlint:
      require-specific: true
    prealloc:
      simple: true
      range-loops: true
      for-loops: true
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: true
      branch-max-lines: 2
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
        path: flags\.go
      - linters:
          - dogsled
          - dupl
          - dupword
          - noctx
          - nolintlint
        path: _test\.go
    paths:
      - .github
      - .git
      - tmp
      - temp
      - testdata
      - __old__
      - third_party$
      - builtin$
      - examples$
      - web/node_modules
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/yuandzhang/webhook-zq)
    gofmt:
      simplify: false
      rewrite-rules:
        - pattern: interface{}
          replacement: any
  exclusions:
    generated: lax
    paths:
      - .github
      - .git
      - tmp
      - temp
      - testdata
      - __old__
      - third_party$
      - builtin$
      - examples$
      - web/node_modules
